name: Main Taski Workflow

on:
  push:
    branches:
      - main

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install flake8
        run: pip install flake8
        
      - name: Run flake8
        run: flake8 backend/ --exclude='*/migrations/*'
